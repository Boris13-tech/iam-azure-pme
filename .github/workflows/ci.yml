name: CI

on:
  push:
    branches:
      - main
      - architecture/phase-5-legacy-cutover
      - security/phase-5e3-dependency-hardening
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma_password
          POSTGRES_DB: luxia_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d luxia_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/luxia_db?schema=public
      DATABASE_MIGRATION_URL: postgresql://prisma:prisma_password@localhost:5432/luxia_db?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Generate Prisma schema
      run: npx prisma generate

    - name: Ensure no UTF-8 BOM in migrations
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');
        const root = 'prisma/migrations';
        if (fs.existsSync(root)) {
          for (const dir of fs.readdirSync(root)) {
            const file = path.join(root, dir, 'migration.sql');
            if (!fs.existsSync(file)) continue;
            const content = fs.readFileSync(file, 'utf8');
            if (content.charCodeAt(0) === 0xFEFF) {
              console.error('BOM detected:', file);
              process.exit(1);
            }
          }
        }
        "

    - name: Deploy Prisma Migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}

    - name: Bootstrap RLS runtime role
      run: |
        cat << 'EOF' > bootstrap.sql
        DO
        $do$
        BEGIN
           IF NOT EXISTS (
              SELECT FROM pg_catalog.pg_roles
              WHERE rolname = 'app_user') THEN
              CREATE ROLE app_user LOGIN PASSWORD 'app_password'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
           END IF;
        END
        $do$;

        GRANT EXECUTE ON FUNCTION public.resolve_session(TEXT) TO app_user;
        GRANT CONNECT ON DATABASE luxia_db TO app_user;
        GRANT USAGE ON SCHEMA public TO app_user;
        GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
        GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
        EOF

        PSQL_URL="${DATABASE_MIGRATION_URL%%\?*}"
        psql -v ON_ERROR_STOP=1 "$PSQL_URL" -f bootstrap.sql

    - name: Run Security Tests
      run: npm run test:security

    - name: Run Provider Adapter Contract Tests
      run: npm run test:provider-adapters

    - name: Build
      run: npm run build

    - name: Run Cutover Readiness Report
      run: npx tsx scripts/generate-cutover-report.ts
      env:
        DATABASE_URL: ${{ env.DATABASE_URL }}
