name: CI

on:
  push:
    branches:
      - main
      - architecture/phase-5-legacy-cutover
      - security/phase-5e3-dependency-hardening
  pull_request:
    branches:
      - main

# Least privilege for the workflow token (the repository default is read; stated here so it cannot widen silently).
permissions:
  contents: read

jobs:
  # Secret scan of the whole history (P6 compensating control: GitHub's non-provider patterns are not
  # available on this plan). Official release only, version and SHA-256 pinned, checked before execution.
  # The public log shows counts, rules, files and commits only, never the matched content.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Gitleaks (official release, pinned version and digest)
      env:
        # Provenance: https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1, digest from its
        # gitleaks_8.30.1_checksums.txt (that file's SHA-256: 061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae).
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .
        count=$(jq 'length' "$RUNNER_TEMP/gitleaks.json")
        echo "Findings: $count"
        if [ "$count" != "0" ]; then
          jq -r '.[] | "\(.RuleID) \(.File) \(.Commit[0:7])"' "$RUNNER_TEMP/gitleaks.json"
          exit 1
        fi

  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma_password
          POSTGRES_DB: luxia_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d luxia_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/luxia_db?schema=public
      DATABASE_MIGRATION_URL: postgresql://prisma:prisma_password@localhost:5432/luxia_db?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Generate Prisma schema
      run: npx prisma generate

    - name: Ensure no UTF-8 BOM in migrations
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');
        const root = 'prisma/migrations';
        if (fs.existsSync(root)) {
          for (const dir of fs.readdirSync(root)) {
            const file = path.join(root, dir, 'migration.sql');
            if (!fs.existsSync(file)) continue;
            const content = fs.readFileSync(file, 'utf8');
            if (content.charCodeAt(0) === 0xFEFF) {
              console.error('BOM detected:', file);
              process.exit(1);
            }
          }
        }
        "

    - name: Deploy Prisma Migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}

    - name: Bootstrap RLS runtime role
      run: |
        PSQL_URL="${DATABASE_MIGRATION_URL%%\?*}"
        psql -v ON_ERROR_STOP=1 "$PSQL_URL" -f scripts/ci/bootstrap-app-user.sql

    - name: Run Security Tests
      run: npm run test:security

    - name: Resources Governance and real PostgreSQL RLS
      run: npm run test:resources
      env:
        LUXIA_RESOURCE_RLS: 'true'

    - name: Run Provider Adapter Contract Tests
      run: npm run test:provider-adapters

    - name: Run Phase 6D Identity Semantics Tests
      run: npm run test:identity

    - name: Run Identity v1 Operational Certification
      run: npm run test:operations

    - name: Run Microsoft Entra Parity Tests
      run: npm run test:entra-parity

    - name: Build
      run: npm run build

    - name: Run Cutover Readiness Report
      run: npx tsx scripts/generate-cutover-report.ts
      env:
        DATABASE_URL: ${{ env.DATABASE_URL }}

  # Independent backup (docs/operations/INDEPENDENT-BACKUP-ARCHITECTURE.md), proven end to end on every change:
  # the backup role reads everything and writes nothing; a backup restores into a blank database identical, table
  # by table and object by object; and the application's PostgreSQL suites pass on the restored database.
  backup-restore-roundtrip:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma_password
          POSTGRES_DB: luxia_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d luxia_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/luxia_db?schema=public
      DATABASE_MIGRATION_URL: postgresql://prisma:prisma_password@localhost:5432/luxia_db?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      LUXIA_RESOURCE_RLS: 'true'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Install the PostgreSQL 17 client and age (as the backup workflow does)
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q postgresql-common age
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y -q postgresql-client-17
        echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

    - name: Migrate and bootstrap the runtime role
      run: |
        npx prisma migrate deploy
        "$PG_BIN/psql" -v ON_ERROR_STOP=1 "${DATABASE_MIGRATION_URL%%\?*}" -f scripts/ci/bootstrap-app-user.sql
      env:
        DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}

    - name: Fill the database with many tenants (the PostgreSQL suites leave their fixtures)
      run: npm run test:resources

    - name: Create the backup role exactly as in Production
      run: |
        "$PG_BIN/psql" -v ON_ERROR_STOP=1 "${DATABASE_MIGRATION_URL%%\?*}" -f scripts/backup/luxia-backup-role.sql
        LUXIA_OWNER_DATABASE_URL="${DATABASE_MIGRATION_URL%%\?*}" node scripts/backup/set-backup-password.mjs "$RUNNER_TEMP/backup.url"

    - name: The backup role reads every tenant and can change nothing
      run: LUXIA_BACKUP_DATABASE_URL="$(cat "$RUNNER_TEMP/backup.url")" npx vitest run tests/backup

    - name: Back up with a throwaway key (encryption with the public key only)
      run: |
        age-keygen -o "$RUNNER_TEMP/ci.agekey" 2>/dev/null
        age-keygen -y "$RUNNER_TEMP/ci.agekey" > "$RUNNER_TEMP/ci-recipient.txt"
        LUXIA_BACKUP_DATABASE_URL="$(cat "$RUNNER_TEMP/backup.url")" LUXIA_BACKUP_RECIPIENT_FILE="$RUNNER_TEMP/ci-recipient.txt" \
          node scripts/backup/backup.mjs --out "$RUNNER_TEMP/backup"

    - name: Restore into a blank database and compare with the backup's inventory
      run: |
        "$PG_BIN/psql" -v ON_ERROR_STOP=1 "${DATABASE_MIGRATION_URL%%\?*}" -c "CREATE DATABASE luxia_restored"
        LUXIA_RESTORE_TARGET_URL=postgresql://prisma:prisma_password@localhost:5432/luxia_restored \
          node scripts/backup/restore.mjs --from-dir "$RUNNER_TEMP/backup" --identity "$RUNNER_TEMP/ci.agekey" --report "$RUNNER_TEMP/restore-report.json"

    - name: The restored database isolates every organization and keeps the journal append-only
      run: node scripts/backup/verify-restored.mjs
      env:
        LUXIA_RESTORE_TARGET_URL: postgresql://prisma:prisma_password@localhost:5432/luxia_restored
        LUXIA_RESTORE_APP_URL: postgresql://app_user:app_password@localhost:5432/luxia_restored

    - name: The application's PostgreSQL suites pass on the restored database
      run: |
        npm run test:resources
        npm run test:security
      env:
        DATABASE_URL: postgresql://app_user:app_password@localhost:5432/luxia_restored?schema=public
        DATABASE_MIGRATION_URL: postgresql://prisma:prisma_password@localhost:5432/luxia_restored?schema=public

  production-activation:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'ops: execute production activation gate'"
    needs: test-and-build
    uses: ./.github/workflows/production-activation-gate.yml
    secrets: inherit

  production-identity-preflight:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'ops(identity): execute production identity preflight'"
    needs: test-and-build
    uses: ./.github/workflows/production-activation-gate.yml
    with:
      operation: identity-preflight
    secrets: inherit

  production-identity-apply:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'ops(identity): execute production identity apply'"
    needs: test-and-build
    uses: ./.github/workflows/production-activation-gate.yml
    with:
      operation: identity-apply
      confirmation: APPLY_CANONICAL_IDENTITY_BOOTSTRAP_PRODUCTION
    secrets: inherit
