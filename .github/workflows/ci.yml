name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma_password
          POSTGRES_DB: luxia_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/luxia_db?schema=public
      DATABASE_MIGRATION_URL: postgresql://prisma:prisma_password@localhost:5432/luxia_db?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Generate Prisma schema
      run: npx prisma generate

    - name: Deploy Prisma Migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}

    - name: Run Security Tests
      run: npm run test:security

    - name: Build
      run: npm run build
