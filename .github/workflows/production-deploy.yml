name: Production deploy

# The only way to change the code running in Production (docs/operations/PRODUCTION-CHANGE-RECORD.md, GOV-001).
# A person starts it with the exact commit; the deploy job waits in the protected "Production" environment until the
# operator approves it in GitHub, which records who approved, when, and for which run. The job then deploys that
# commit through the Vercel API (gitSource), checks Production from outside, and promotes back the previous
# deployment if a check fails. No local command line and no personal credential is involved.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on main, with a green CI run
        required: true
        type: string
      reason:
        description: Why this deployment (recorded in the run summary)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: The commit is on main and its CI passed
        env:
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lowercase commit SHA"; exit 1; }
          status="$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)"
          [[ "$status" == "ahead" || "$status" == "identical" ]] || { echo "::error::$SHA is not on main ($status)"; exit 1; }
          green="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=10" --jq '[.workflow_runs[] | select(.head_branch == "main")] | length')"
          [[ "$green" -ge 1 ]] || { echo "::error::no successful CI run on main for $SHA"; exit 1; }
          echo "verified: $SHA is on main with a green CI run"

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    # Required reviewer: the operator. Nothing below runs before that approval.
    environment: Production
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      SHA: ${{ inputs.sha }}
      REASON: ${{ inputs.reason }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
      TEAM: ${{ vars.VERCEL_TEAM_ID }}
      PROJECT: ${{ vars.VERCEL_PROJECT_ID }}
      REPO_ID: ${{ vars.GITHUB_REPOSITORY_ID_FOR_VERCEL }}
      BASE: https://iam-azure-pme.vercel.app
    steps:
      - name: Deploy the exact commit and wait until it serves Production
        id: deploy
        run: |
          set -euo pipefail
          for v in VERCEL_TOKEN TEAM PROJECT REPO_ID; do [[ -n "${!v}" ]] || { echo "::error::$v is not configured on the Production environment"; exit 1; }; done
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" "$@"; }
          previous="$(api "https://api.vercel.com/v9/projects/$PROJECT?teamId=$TEAM" | jq -r '.targets.production.id // empty')"
          [[ -n "$previous" ]] || { echo "::error::cannot read the current Production deployment"; exit 1; }
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          body="$(jq -n --arg sha "$SHA" --argjson repo "$REPO_ID" \
            '{name: "iam-azure-pme", project: "iam-azure-pme", target: "production", gitSource: {type: "github", repoId: $repo, ref: "main", sha: $sha}}')"
          id="$(api -X POST "https://api.vercel.com/v13/deployments?forceNew=1&teamId=$TEAM" -d "$body" | jq -r .id)"
          echo "deployment=$id" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            state="$(api "https://api.vercel.com/v13/deployments/$id?teamId=$TEAM" | jq -r .readyState)"
            [[ "$state" == "READY" ]] && break
            [[ "$state" == "ERROR" || "$state" == "CANCELED" ]] && { echo "::error::deployment $id ended $state"; exit 1; }
            sleep 10
          done
          [[ "$state" == "READY" ]] || { echo "::error::deployment $id not ready after 10 minutes"; exit 1; }
          current="$(api "https://api.vercel.com/v9/projects/$PROJECT?teamId=$TEAM" | jq -r '.targets.production.id // empty')"
          [[ "$current" == "$id" ]] || { echo "::error::Production serves $current, not $id"; exit 1; }
          echo "Production now serves $id (previous $previous)"

      - name: Check Production from outside
        id: checks
        run: |
          set -u
          check() {
            login=$(curl -s -o login.html -w '%{http_code}' --max-time 20 "$BASE/login") || login=000
            root=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$BASE/") || root="000 -"
            api=$(curl -s -o api.json -w '%{http_code}' --max-time 20 "$BASE/api/canonical/sessions") || api=000
            [ "$login" = "200" ] && grep -q '<title>LUXIA' login.html && [ "$root" = "307 $BASE/login" ] \
              && [ "$api" = "401" ] && grep -q '"error":"Unauthorized"' api.json
          }
          for attempt in 1 2 3; do
            if check; then echo "after-checks passed (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt failed: login=$login root=$root api=$api"; sleep 20
          done
          echo "::error::after-checks failed"; exit 1

      - name: Promote the previous deployment back if a check failed
        if: failure() && steps.deploy.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$PROJECT/promote/$PREVIOUS?teamId=$TEAM" > /dev/null
          echo "::warning::rolled back: Production promoted back to $PREVIOUS"

      - name: Record the change (approval, commit, deployments, checks)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
          CHECKS: ${{ steps.checks.outcome }}
        run: |
          approvals="$(gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" --jq '[.[] | "\(.user.login) \(.state) at run \(env.RUN_ID): \(.comment // "")"] | join("; ")' || echo unreadable)"
          {
            echo "## Production change record"
            echo "| Item | Value |"; echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Reason | $REASON |"
            echo "| Approval (GitHub environment Production) | $approvals |"
            echo "| Deployment | \`${DEPLOYMENT:-none}\` |"
            echo "| Previous (rollback target) | \`${PREVIOUS:-unknown}\` |"
            echo "| After-checks | ${CHECKS:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
