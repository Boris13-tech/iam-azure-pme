name: Independent backup

# Encrypted logical backup of the Production database, every hour, to EU object storage that refuses deletion
# (docs/operations/INDEPENDENT-BACKUP-ARCHITECTURE.md, runbook docs/operations/BACKUP-RUNBOOK.md).
# The job holds the backup PUBLIC key only: it can write backups, never read them. Its log is public (public
# repository): the script prints no row count, no connection detail and no secret.
on:
  schedule:
    # Primary hourly trigger: the Azure Logic App luxia-backup-dispatcher (workflow_dispatch at :53 UTC). GitHub's
    # scheduler is irregular here (0 runs until 2026-10-13; on 2026-10-14, 4 runs in 18 slots, up to an hour late), so
    # this schedule is only a fallback: the gate job below backs up only if no dispatched backup succeeded in the last
    # 65 minutes, which means Azure missed its slot. If no complete backup lands for 3 hours, an Azure alert e-mails the
    # operator (runbook, section 2).
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  # Decides without any secret: workflow_dispatch (Azure, or by hand) always backs up; a scheduled run backs up only
  # when the primary trigger missed. Fail-open: if the run history cannot be read, back up.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: back up ($EVENT)"; exit 0; fi
          if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/backup.yml/runs?branch=main&per_page=30" > "$RUNNER_TEMP/runs.json"; then
            node scripts/backup/schedule-gate.mjs "$RUNNER_TEMP/runs.json" "$GITHUB_RUN_ID" 65 >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: back up (run history unavailable)"
          fi

  backup:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Environment secrets, released to the main branch only.
    environment: production-backup
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install the PostgreSQL 17 client and age
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: Back up, encrypt, upload and read back
        env:
          LUXIA_BACKUP_DATABASE_URL: ${{ secrets.LUXIA_BACKUP_DATABASE_URL }}
          LUXIA_BACKUP_CONTAINER_URL: ${{ secrets.LUXIA_BACKUP_CONTAINER_URL }}
        run: node scripts/backup/backup.mjs
