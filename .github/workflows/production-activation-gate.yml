name: Production Activation Gate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Activation gate or canonical identity bootstrap operation
        required: true
        type: choice
        default: activation
        options:
          - activation
          - identity-preflight
          - identity-apply
      confirmation:
        description: Required only for identity-apply
        required: false
        type: string
      release:
        description: Activation only. The authorized release, a tag (rc-private-beta-1) or the full commit SHA
        required: false
        type: string
      sha:
        description: Activation only. The full 40-character commit SHA that the release must be, on main, with a green CI run
        required: false
        type: string

permissions:
  contents: read

# One Production operation at a time, never queued, with no concurrency group: a group keeps one pending run that a later
# dispatch or re-run replaces (Codex, reviews of #191). The first job refuses while another activation or deploy is open,
# and the Production job checks again after its approval and before acting, which also covers a re-run of that job alone:
# of two overlapping operations, at least one sees the other and refuses.

jobs:
  # Replaces the former `needs: test-and-build` of the commit-message triggers in ci.yml (removed): a Production
  # operation starts only when dispatched from main, on a commit whose CI run on main (push) succeeded. The Production
  # environment still requires its reviewer and allows main only.
  ci-verified:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.verify.outputs.ci_run_id }}
      ci_run_url: ${{ steps.verify.outputs.ci_run_url }}
      ci_head_sha: ${{ steps.verify.outputs.ci_head_sha }}
      ci_workflow_name: ${{ steps.verify.outputs.ci_workflow_name }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_ci_run_url: ${{ steps.release.outputs.ci_run_url }}
    steps:
      - name: Checkout the operation checks (this workflow's commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/ops
          persist-credentials: false

      - name: No other Production operation is queued, waiting or in progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/ops/verify-no-other-operation.sh

      - name: Dispatched from main, on a commit whose CI passed
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "REFUSED: dispatch from main only (got $GITHUB_REF)"; exit 1; fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=completed&per_page=1" \
            --jq '.workflow_runs[0] // {} | [(.id // "" | tostring), (.head_sha // ""), (.name // ""), (.html_url // ""), (.conclusion // "none")] | join("\u001f")')
          # A non-blank separator: empty fields keep their place (blank separators would merge them).
          IFS=$'\x1f' read -r run_id run_sha run_name run_url conclusion <<< "$run"
          if [ "$conclusion" != "success" ]; then echo "REFUSED: CI on $GITHUB_SHA is '$conclusion', not success"; exit 1; fi
          if [ "$run_sha" != "$GITHUB_SHA" ]; then echo "REFUSED: the accepted run is for $run_sha, not $GITHUB_SHA"; exit 1; fi
          # Evidence of the accepted CI run: in the log, in the job summary, and as outputs for the Production jobs.
          echo "Accepted CI run: id=$run_id sha=$run_sha workflow=\"$run_name\" url=$run_url"
          {
            echo "### CI run accepted for this Production operation"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| CI run ID | $run_id |"
            echo "| Head SHA | $run_sha |"
            echo "| Workflow | $run_name |"
            echo "| Run URL | $run_url |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "ci_run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "ci_head_sha=$run_sha" >> "$GITHUB_OUTPUT"
          echo "ci_workflow_name=$run_name" >> "$GITHUB_OUTPUT"

      # The workflow above is main's; what it applies is the release the operator authorized, never main's tip: a merge
      # into main after the authorization changes nothing in this operation.
      - name: Activation only, the authorized release is one commit on main with a green CI run
        id: release
        if: ${{ inputs.operation == '' || inputs.operation == 'activation' }}
        env:
          RELEASE: ${{ inputs.release }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          verified="$(bash scripts/ops/verify-release.sh "$RELEASE" "$SHA")" || { echo "$verified"; exit 1; }
          echo "$verified"
          grep -E '^(sha|ci_run_url)=' <<< "$verified" >> "$GITHUB_OUTPUT"
          {
            echo "### Authorized release"
            echo "| Field | Value |"
            echo "|---|---|"
            sed -E 's/^([a-z_]+)=(.*)$/| \1 | \2 |/' <<< "$verified"
            echo "| Workflow commit (main) | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"

  database-activation:
    needs: ci-verified
    if: ${{ inputs.operation == '' || inputs.operation == 'activation' }}
    runs-on: ubuntu-latest
    environment: Production
    # actions: read for the release verifier (the CI run of the release), after the approval.
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: baseline
          POSTGRES_PASSWORD: baseline_password
          POSTGRES_DB: baseline_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baseline -d baseline_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      PRODUCTION_BACKUP_BRANCH_ID: ${{ vars.PRODUCTION_BACKUP_BRANCH_ID }}
    steps:
      - name: Checkout the authorized release, not main's tip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.ci-verified.outputs.release_sha }}
          persist-credentials: false

      - name: Checkout the release verifier (this workflow's commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: .gate
          sparse-checkout: scripts/ops
          persist-credentials: false

      - name: Still no other Production operation, checked again inside this job (also on a re-run of this job alone)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash .gate/scripts/ops/verify-no-other-operation.sh

      - name: After approval, the release still resolves to the checked-out commit
        env:
          RELEASE: ${{ inputs.release }}
          SHA: ${{ needs.ci-verified.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The approval may come much later than the dispatch: a tag moved meanwhile, or a checkout of anything else,
          # stops the activation before Production is touched.
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "REFUSED: no verified release"; exit 1; }
          bash .gate/scripts/ops/verify-release.sh "$RELEASE" "$SHA"
          head="$(git rev-parse HEAD)"
          [[ "$head" == "$SHA" ]] || { echo "REFUSED: checked out $head, not the authorized $SHA"; exit 1; }
          echo "Release verified after approval: $RELEASE = $SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Validate activation inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing Production DATABASE_URL"; exit 1; }
          test -n "$DATABASE_MIGRATION_URL" || { echo "Missing Production DATABASE_MIGRATION_URL"; exit 1; }
          test -n "$PRODUCTION_BASE_URL" || { echo "Missing PRODUCTION_BASE_URL"; exit 1; }
          test -n "$PRODUCTION_BACKUP_BRANCH_ID" || { echo "Missing PRODUCTION_BACKUP_BRANCH_ID"; exit 1; }
          [[ "$DATABASE_URL" == postgresql://app_user:* ]] || { echo "Production runtime URL is not app_user"; exit 1; }
          [[ "$DATABASE_URL" == *-pooler.* ]] || { echo "Production runtime URL is not pooled"; exit 1; }
          [[ "$DATABASE_MIGRATION_URL" == postgresql://neondb_owner:* ]] || { echo "Production migration URL is not neondb_owner"; exit 1; }
          [[ "$DATABASE_MIGRATION_URL" != *-pooler.* ]] || { echo "Production migration URL must be direct"; exit 1; }
          echo "Production activation inputs PASS"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate and generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Reconcile verified legacy baseline
        shell: bash
        env:
          BASELINE_SHADOW_URL: postgresql://baseline:baseline_password@127.0.0.1:5432/baseline_shadow?schema=public
        run: |
          set -euo pipefail
          PSQL_URL="${DATABASE_MIGRATION_URL%%\?*}"
          has_history="$(psql "$PSQL_URL" -Atqc "SELECT to_regclass('public._prisma_migrations') IS NOT NULL")"
          if [ "$has_history" = "t" ]; then
            echo "Prisma migration history already exists; legacy reconciliation not required."
            exit 0
          fi

          actual_tables="$(psql "$PSQL_URL" -Atqc "SELECT string_agg(tablename, ',' ORDER BY tablename) FROM pg_tables WHERE schemaname='public'")"
          expected_tables="AccessPolicy,AuditLog,Permission,Role,RolePermission,User,UserRole"
          if [ "$actual_tables" != "$expected_tables" ]; then
            echo "Legacy baseline rejected: unexpected Production table inventory."
            exit 1
          fi

          index_drift="$(psql "$PSQL_URL" -Atqc "WITH expected(name) AS (SELECT unnest(ARRAY['AccessPolicy_pkey','AuditLog_pkey','Permission_action_resource_key','Permission_pkey','RolePermission_pkey','Role_name_key','Role_pkey','UserRole_pkey','User_azureId_key','User_email_key','User_pkey'])), actual(name) AS (SELECT indexname::text FROM pg_indexes WHERE schemaname='public') SELECT count(*) FROM ((SELECT name FROM expected EXCEPT SELECT name FROM actual) UNION ALL (SELECT name FROM actual EXCEPT SELECT name FROM expected)) drift")"
          if [ "$index_drift" != "0" ]; then
            echo "Legacy baseline rejected: unexpected Production index inventory."
            exit 1
          fi

          constraint_drift="$(psql "$PSQL_URL" -Atqc "WITH expected(name) AS (SELECT unnest(ARRAY['AccessPolicy_pkey','AuditLog_actorId_fkey','AuditLog_pkey','Permission_pkey','RolePermission_permissionId_fkey','RolePermission_pkey','RolePermission_roleId_fkey','Role_pkey','UserRole_pkey','UserRole_roleId_fkey','UserRole_userId_fkey','User_pkey'])), actual(name) AS (SELECT conname::text FROM pg_constraint WHERE connamespace='public'::regnamespace) SELECT count(*) FROM ((SELECT name FROM expected EXCEPT SELECT name FROM actual) UNION ALL (SELECT name FROM actual EXCEPT SELECT name FROM expected)) drift")"
          if [ "$constraint_drift" != "0" ]; then
            echo "Legacy baseline rejected: unexpected Production constraint inventory."
            exit 1
          fi

          mkdir -p /tmp/init-migrations/20260917000000_init
          printf 'provider = "postgresql"\n' > /tmp/init-migrations/migration_lock.toml
          cp prisma/migrations/20260917000000_init/migration.sql /tmp/init-migrations/20260917000000_init/migration.sql

          npx prisma migrate diff \
            --from-url "$DATABASE_MIGRATION_URL" \
            --to-migrations /tmp/init-migrations \
            --shadow-database-url "$BASELINE_SHADOW_URL" \
            --script > /tmp/legacy-baseline.sql

          if grep -Eiq '^[[:space:]]*(DROP|DELETE[[:space:]]+FROM|TRUNCATE|RENAME)|^[[:space:]]*ALTER[[:space:]]+TABLE.*(DROP|ALTER[[:space:]]+COLUMN)' /tmp/legacy-baseline.sql; then
            echo "Legacy baseline rejected: generated delta contains a destructive operation."
            sed -E 's#(postgresql://)[^[:space:]]+#\1***#g' /tmp/legacy-baseline.sql
            exit 1
          fi
          if ! grep -Eq 'CREATE (TYPE|TABLE|UNIQUE INDEX|INDEX)|ADD CONSTRAINT' /tmp/legacy-baseline.sql; then
            echo "Legacy baseline rejected: no additive schema delta was generated."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 --single-transaction "$PSQL_URL" -f /tmp/legacy-baseline.sql
          DATABASE_URL="$DATABASE_MIGRATION_URL" npx prisma migrate resolve --applied 20260917000000_init
          echo "Verified legacy baseline reconciliation PASS"

      - name: Before migrating, the database holds no migration outside the release
        shell: bash
        run: |
          set -euo pipefail
          PSQL_URL="${DATABASE_MIGRATION_URL%%\?*}" bash .gate/scripts/ops/verify-schema-release.sh prisma/migrations --before-migrate

      - name: Apply additive migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: npx prisma migrate deploy

      - name: The applied migrations are exactly the release's
        shell: bash
        run: |
          set -euo pipefail
          PSQL_URL="${DATABASE_MIGRATION_URL%%\?*}" bash .gate/scripts/ops/verify-schema-release.sh prisma/migrations

      - name: Recreate unsafe runtime role without BYPASSRLS
        shell: bash
        run: |
          set -euo pipefail
          PSQL_URL="${DATABASE_MIGRATION_URL%%\?*}"
          bypass="$(psql "$PSQL_URL" -Atqc "SELECT rolbypassrls FROM pg_roles WHERE rolname='app_user'")"
          if [ "$bypass" = "f" ]; then
            echo "Runtime role already has NOBYPASSRLS."
            exit 0
          fi

          runtime_password="$(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).password)')"
          test -n "$runtime_password" || { echo "Runtime password could not be resolved"; exit 1; }

          if [ -z "$bypass" ]; then
            psql -v ON_ERROR_STOP=1 --single-transaction \
              -v runtime_password="$runtime_password" "$PSQL_URL" <<'SQL'
          CREATE ROLE app_user LOGIN PASSWORD :'runtime_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          SQL
            unset runtime_password
            echo "Runtime role created with NOBYPASSRLS."
            exit 0
          fi

          if [ "$bypass" != "t" ]; then
            unset runtime_password
            echo "Runtime role state is ambiguous."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 --single-transaction \
            -v runtime_password="$runtime_password" "$PSQL_URL" <<'SQL'
          DROP OWNED BY app_user;
          DROP ROLE app_user;
          CREATE ROLE app_user LOGIN PASSWORD :'runtime_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          SQL
          unset runtime_password
          echo "Runtime role recreated with NOBYPASSRLS."

      - name: Bootstrap least-privilege runtime grants
        shell: bash
        run: |
          set -euo pipefail
          PSQL_URL="${DATABASE_MIGRATION_URL%%\?*}"
          # One transaction: the broad grants and their narrowing commit together, or not at all (Codex, review of #190).
          psql -v ON_ERROR_STOP=1 --single-transaction "$PSQL_URL" <<'SQL'
          GRANT CONNECT ON DATABASE neondb TO app_user;
          GRANT USAGE ON SCHEMA public TO app_user;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
          GRANT EXECUTE ON FUNCTION public.resolve_session(TEXT) TO app_user;
          GRANT EXECUTE ON FUNCTION public.luxia_session_resolve(TEXT) TO app_user;
          GRANT EXECUTE ON FUNCTION public.luxia_organization_lock_active(TEXT) TO app_user;
          -- D8.4 (issue #150): the retention functions belong to the job's own role, never to the role that serves
          -- web requests. The role is created by migration 20261114120000; its password is the operator's, set in Neon.
          -- Decided by whether that migration is applied, not by whether the role exists: its rollback keeps the role
          -- (a Production secret names it), and a release from before D8.4, activated afterwards, runs its job as
          -- app_user, which must then keep the four functions (Gemini 4 Hydrogen F-04, third review of #196).
          -- Without a migration history (a database migrated file by file, as the Production-like test does), the
          -- schema itself answers: the migration leaves the four with the role, and its rollback takes them away.
          DO $$
          DECLARE
            v_d84 boolean;
            v_function text;
          BEGIN
            IF to_regclass('public._prisma_migrations') IS NOT NULL THEN
              EXECUTE $q$SELECT EXISTS (SELECT 1 FROM public._prisma_migrations WHERE migration_name = '20261114120000_retention_worker_role'
                AND finished_at IS NOT NULL AND rolled_back_at IS NULL)$q$ INTO v_d84;
            ELSE
              -- to_regprocedure, not a ::regprocedure cast: a cast is resolved when the statement is parsed, so it would
              -- fail on a release without the function even behind the guard (Claude Opus, fourth review of #196).
              v_d84 := coalesce(to_regprocedure('public.luxia_retention_status()') IS NOT NULL
                AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'luxia_retention')
                AND has_function_privilege('luxia_retention', to_regprocedure('public.luxia_retention_status()'), 'EXECUTE'), false);
            END IF;
            FOREACH v_function IN ARRAY ARRAY['public.luxia_retention_purge_transactions(integer,boolean)',
              'public.luxia_retention_purge_invitations(integer,boolean)', 'public.luxia_retention_pseudonymize_retired(integer,boolean)',
              'public.luxia_retention_status()'] LOOP
              CONTINUE WHEN to_regprocedure(v_function) IS NULL;
              IF v_d84 THEN
                EXECUTE format('GRANT EXECUTE ON FUNCTION %s TO luxia_retention', to_regprocedure(v_function));
                EXECUTE format('REVOKE EXECUTE ON FUNCTION %s FROM app_user', to_regprocedure(v_function));
              ELSE
                EXECUTE format('GRANT EXECUTE ON FUNCTION %s TO app_user', to_regprocedure(v_function));
              END IF;
            END LOOP;
          END $$;
          -- (The three retention functions above came after rc-private-beta-1: granted only when the release has them.)
          -- Re-apply the narrower grants of later migrations, which the broad grant above would widen again
          -- (same mirror as the CI bootstrap): Customer Self-Onboarding v1, and T0 (append-only audit trail).
          REVOKE ALL ON "SignupCode", "RateLimitBucket", "RateLimitConfig" FROM app_user;
          REVOKE ALL ON "OrganizationDomain", "Invitation" FROM app_user;
          GRANT SELECT, INSERT, UPDATE ON "OrganizationDomain", "Invitation" TO app_user;
          REVOKE UPDATE, DELETE, TRUNCATE ON "CanonicalAdminAuditEvent", "AuthenticationEvidence" FROM app_user;
          -- R3: retention runs are owner-only, and only the purge function deletes expired sign-in rows.
          REVOKE ALL ON "RetentionRun" FROM app_user;
          REVOKE ALL ON SEQUENCE "RetentionRun_id_seq" FROM app_user;
          -- R7: the erasure record is owner-only.
          REVOKE ALL ON "OrganizationErasure" FROM app_user;
          REVOKE ALL ON SEQUENCE "OrganizationErasure_id_seq" FROM app_user;
          -- F2 and F3: provider connections and secret references are never deleted.
          REVOKE DELETE, TRUNCATE ON "ProviderConnection" FROM app_user;
          REVOKE DELETE, TRUNCATE ON "ProviderSecretReference" FROM app_user;
          -- Resource scopes, SoD and access reviews: the migrations grant less than the broad grant (Codex, review of #190).
          REVOKE UPDATE, DELETE, TRUNCATE ON "ResourceScope", "ResourceScopeMember" FROM app_user;
          REVOKE DELETE, TRUNCATE ON "SoDPolicy", "SoDRule", "AccessReviewCampaign", "AccessReviewItem" FROM app_user;
          -- Prisma's migration history decides whether code may be deployed: the runtime role reads it, never writes it
          -- (Codex, review of #191). The table exists once Prisma has run.
          DO $$ BEGIN IF to_regclass('public._prisma_migrations') IS NOT NULL THEN
            REVOKE INSERT, UPDATE, DELETE, TRUNCATE ON "_prisma_migrations" FROM app_user;
          END IF; END $$;
          REVOKE DELETE, TRUNCATE ON "AuthTransaction", "LocalAuthChallenge" FROM app_user;
          -- D8.2: the hold register and its history are owner-only; only when the release has them.
          DO $$ BEGIN IF to_regclass('public."RetentionHold"') IS NOT NULL THEN
            REVOKE ALL ON "RetentionHold", "RetentionHoldEvent" FROM app_user;
            REVOKE ALL ON SEQUENCE "RetentionHoldEvent_id_seq" FROM app_user;
          END IF; END $$;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO app_user;
          SQL

      - name: Verify migration state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: npx prisma migrate status

      - name: Verify runtime role and RLS posture
        run: |
          cat > verify-production.ts <<'TS'
          import { readFileSync } from "node:fs";
          import { PrismaClient } from "@prisma/client";

          const requiredRlsTables = [
            "Subject",
            "IdentityAccount",
            "Resource",
            "Session",
            "Entitlement",
            "Assignment",
            "AuthorizationShadowObservation",
            "LocalIdentity",
            "LocalAuthenticator",
            "LocalAuthChallenge",
            "LocalRecoveryCode",
            "AuthenticationEvidence",
            "CryptoKeyVersion",
            "TrustAnchorVersion",
            "IdentityContinuityState",
            "OfflineIdentityChallenge",
            "IdentityAssuranceSnapshot",
            "IdentityContinuityEvent",
            "IdentityContinuityConflict",
            "IdentityPortabilityReceipt",
            "IdentityRecoveryCeremony",
            "IdentityRecoveryApproval",
            "IdentityPortabilityConflict",
            "CredentialReenrollmentRequirement",
            "ProviderIdentityCollision",
          ];

          async function main() {
            const db = new PrismaClient({ datasourceUrl: process.env.DATABASE_URL });
            try {
              const posture = await db.$queryRaw<Array<{
                current_user: string;
                rolsuper: boolean;
                rolbypassrls: boolean;
                resolver_execute: boolean;
                canonical_resolver_execute: boolean;
              }>>`
                SELECT current_user, r.rolsuper, r.rolbypassrls,
                  has_function_privilege(current_user, 'public.resolve_session(text)', 'EXECUTE') AS resolver_execute,
                  has_function_privilege(current_user, 'public.luxia_session_resolve(text)', 'EXECUTE') AS canonical_resolver_execute
                FROM pg_roles r WHERE r.rolname = current_user
              `;
              if (posture.length !== 1) throw new Error("Runtime role not resolved");
              const role = posture[0];
              if (role.current_user !== "app_user") throw new Error(`Unexpected runtime role: ${role.current_user}`);
              if (role.rolsuper) throw new Error("Runtime role is SUPERUSER");
              if (role.rolbypassrls) throw new Error("Runtime role has BYPASSRLS");
              if (!role.resolver_execute) throw new Error("Runtime role cannot execute resolve_session");
              if (!role.canonical_resolver_execute) throw new Error("Runtime role cannot execute luxia_session_resolve");

              const rls = await db.$queryRaw<Array<{ relname: string; relrowsecurity: boolean; relforcerowsecurity: boolean }>>`
                SELECT c.relname, c.relrowsecurity, c.relforcerowsecurity
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relname = ANY(${requiredRlsTables})
              `;
              const byName = new Map(rls.map((row) => [row.relname, row]));
              for (const table of requiredRlsTables) {
                const row = byName.get(table);
                if (!row) throw new Error(`Missing required table: ${table}`);
                if (!row.relrowsecurity || !row.relforcerowsecurity) {
                  throw new Error(`RLS is not enabled and forced on ${table}`);
                }
              }

              // Owner-only tables (forced row-level security, no policy): no privilege for the runtime role, nor on their sequences.
              const ownerOnly = await db.$queryRaw<Array<{ relname: string }>>`
                SELECT c.relname FROM pg_class c
                WHERE c.relnamespace = 'public'::regnamespace AND c.relkind IN ('r', 'p') AND c.relrowsecurity AND c.relforcerowsecurity
                  AND NOT EXISTS (SELECT 1 FROM pg_policy p WHERE p.polrelid = c.oid)
                  AND (EXISTS (SELECT 1 FROM unnest(ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER']) p WHERE has_table_privilege(current_user, c.oid, p))
                    OR EXISTS (SELECT 1 FROM pg_depend d JOIN pg_class s ON s.oid = d.objid AND s.relkind = 'S'
                               WHERE d.refobjid = c.oid AND d.deptype IN ('a', 'i') AND (has_sequence_privilege(current_user, s.oid, 'USAGE') OR has_sequence_privilege(current_user, s.oid, 'SELECT'))))
              `;
              if (ownerOnly.length > 0) throw new Error(`Runtime role holds privileges on owner-only tables: ${ownerOnly.map((row) => row.relname).join(", ")}`);
              // The migration history decides deployments: the runtime role reads it, never writes it.
              const history = await db.$queryRaw<Array<{ writable: boolean }>>`
                SELECT EXISTS (SELECT 1 FROM unnest(ARRAY['INSERT','UPDATE','DELETE','TRUNCATE']) p
                  WHERE has_table_privilege(current_user, 'public._prisma_migrations', p)) AS writable
              `;
              if (history[0]?.writable !== false) throw new Error("Runtime role can write the migration history");
              // D8.4 (issue #150): the privilege to run a destructive retention job is not reachable from the role
              // that serves web requests. Every role app_user can become counts, itself included: a membership
              // permits SET ROLE even when it is not inherited, so asking only about app_user's own effective
              // privilege would miss that path (Codex F1, review of #196).
              // Asserted when the release has D8.4 applied; a release from before it runs its job as app_user by design.
              const d84 = await db.$queryRaw<Array<{ applied: boolean }>>`
                SELECT EXISTS (SELECT 1 FROM public._prisma_migrations WHERE migration_name = '20261114120000_retention_worker_role'
                  AND finished_at IS NOT NULL AND rolled_back_at IS NULL) AS applied
              `;
              if (d84[0]?.applied === true) {
                const retention = await db.$queryRaw<Array<{ reachable: string }>>`
                  SELECT coalesce(string_agg(DISTINCT p.proname || ' as ' || r.rolname, ', '), '') AS reachable
                  FROM pg_proc p CROSS JOIN pg_roles r
                  WHERE p.pronamespace = 'public'::regnamespace AND p.proname LIKE 'luxia_retention%'
                    AND pg_has_role('app_user', r.oid, 'MEMBER') AND has_function_privilege(r.oid, p.oid, 'EXECUTE')
                `;
                if (retention[0]?.reachable !== "") throw new Error(`Runtime role can reach retention functions: ${retention[0]?.reachable}`);
                // The worker role itself, again, at every activation: the migration checked it once, when it ran, and
                // a role can drift afterwards (an attribute, a grant, a setting, a member). The release's own validation
                // block is run as it stands, so the two can never differ (Claude Opus, fourth review of #196).
                const migration = readFileSync("prisma/migrations/20261114120000_retention_worker_role/migration.sql", "utf8");
                const from = migration.indexOf("DO $$");
                const validation = migration.slice(from, migration.indexOf("END $$;", from) + "END $$;".length);
                if (!validation.includes("RETENTION_ROLE_UNSAFE")) throw new Error("Retention role validation not found in the release");
                await db.$executeRawUnsafe(validation);
                console.log("Retention PASS: no retention function is reachable from the runtime role; the worker role is still narrow");
              } else {
                console.log("Retention: D8.4 not applied in this release; the job runs as the runtime role");
              }

              console.log("Runtime role PASS: app_user / NOSUPERUSER / NOBYPASSRLS / resolve_session EXECUTE");
              console.log(`RLS PASS: ${requiredRlsTables.length} tenant-scoped tables enabled and forced`);
            } finally {
              await db.$disconnect();
            }
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          });
          TS
          npx tsx verify-production.ts

      - name: Verify production smoke surface
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/login.html --write-out '%{http_code}' "$PRODUCTION_BASE_URL/login")"
          test "$code" = "200" || { echo "Production /login returned HTTP $code"; exit 1; }
          echo "Production HTTP smoke PASS"

      - name: Activation evidence
        env:
          RELEASE: ${{ inputs.release }}
          SHA: ${{ needs.ci-verified.outputs.release_sha }}
        run: |
          echo "Production database activation PASS"
          echo "Release: $RELEASE = $SHA (code checked out and migrations applied: this commit only)"
          echo "Workflow commit (main): $GITHUB_SHA"
          echo "Rollback branch: $PRODUCTION_BACKUP_BRANCH_ID"

  canonical-identity-bootstrap:
    needs: ci-verified
    if: ${{ inputs.operation == 'identity-preflight' || inputs.operation == 'identity-apply' }}
    # actions: read for the called job's check that no other Production operation is open.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/production-identity-bootstrap.yml
    with:
      mode: ${{ inputs.operation == 'identity-apply' && 'apply' || 'preflight' }}
      confirmation: ${{ inputs.confirmation }}
    secrets: inherit
