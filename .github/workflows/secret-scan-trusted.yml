name: Secret scan (trusted)

# The secret scan that a pull request cannot switch off. pull_request_target runs this file as it is on the base
# branch, so a pull request that edits or disables it changes nothing for its own scan. The job never runs the
# pull request's code: it checks the change out as data, with a read-only token and no secret, and reads it with a
# pinned gitleaks release. The ignore file is the base branch's. Make "secret-scan-trusted" a required check.
on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan-trusted:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Trusted definition and ignore file (base branch)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        path: trusted
        persist-credentials: false
    - name: The change to scan, as data only (never executed)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        path: scanned
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Gitleaks (official release, pinned version and digest)
      env:
        # Provenance: https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1, digest from its
        # gitleaks_8.30.1_checksums.txt (that file's SHA-256: 061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae).
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
        # The configuration stays outside the checkout and inline allow comments count for nothing. The ignore file
        # that counts is a trusted one: on a pull request, the base branch's (already reviewed and merged), so an entry a
        # pull request adds never applies to its own scan; on main, the repository's own. A throwaway repository tries all
        # three ways (inline comment, config, ignore file), with a random token, on every run. A change to this job itself
        # is not stopped here: it shows in the diff, and the reviewer must catch it.
        printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
        trusted="$RUNNER_TEMP/trusted.gitleaksignore"
        # The ignore file of the trusted definition (the base branch): never the scanned change's own.
        if [ -f trusted/.gitleaksignore ]; then cp trusted/.gitleaksignore "$trusted"; else : > "$trusted"; fi
        if [ -f scanned/.gitleaksignore ] && ! cmp -s scanned/.gitleaksignore "$trusted"; then
          echo "This change edits .gitleaksignore: its entries apply only after merge, once reviewed."
        fi
        # The scanned directory's own ignore file is replaced by the trusted one before every scan.
        scan() { cp "$3" "$1/.gitleaksignore"; "$RUNNER_TEMP/gitleaks" git --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$3" --ignore-gitleaks-allow --redact --no-banner --exit-code 0 --report-format json --report-path "$2" "$1"; }
        canary="$RUNNER_TEMP/canary"
        git init -q "$canary"
        printf 'token=ghp_%s # gitleaks:allow\n' "$(openssl rand -hex 18)" > "$canary/a.txt"
        printf '[allowlist]\npaths = ["a"]\n' > "$canary/.gitleaks.toml"
        git -C "$canary" add -A
        git -C "$canary" -c user.name=canary -c user.email=canary@example.test commit -q -m canary
        # The canary also plants an ignore entry for its own token, as a pull request could.
        printf '%s:a.txt:github-pat:1\n' "$(git -C "$canary" rev-parse HEAD)" > "$canary/.gitleaksignore"
        : > "$RUNNER_TEMP/empty.gitleaksignore"
        scan "$canary" "$RUNNER_TEMP/canary.json" "$RUNNER_TEMP/empty.gitleaksignore"
        if [ "$(jq 'length' "$RUNNER_TEMP/canary.json")" = "0" ]; then
          echo "The scan missed its canary"
          exit 1
        fi
        scan scanned "$RUNNER_TEMP/gitleaks.json" "$trusted"
        count=$(jq 'length' "$RUNNER_TEMP/gitleaks.json")
        echo "Findings: $count"
        if [ "$count" != "0" ]; then
          jq -r '.[] | "\(.RuleID) \(.File) \(.Commit[0:7])"' "$RUNNER_TEMP/gitleaks.json"
          exit 1
        fi
